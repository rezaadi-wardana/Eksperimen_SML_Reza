name: Automated Data Preprocessing

on:
  push:
    branches: [main]
    paths:
      - "loan_default_raw/**"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run preprocessing
        run: |
          python preprocessing/automate_Reza.py \
            --input loan_default_raw/data_for_training.csv \
            --output preprocessing/loan_default_preprocessed.csv

      - name: Upload preprocessed dataset as artifact
        uses: actions/upload-artifact@v3
        with:
          name: loan_default_preprocessed
          path: preprocessing/loan_default_preprocessed.csv

      - name: Commit and push preprocessed data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add preprocessing/loan_default_preprocessed.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: preprocessed dataset"
          git push
