name: Automated Data Preprocessing

on:
  push:
    branches: [main]
    paths:
      - "loan_default_raw/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run preprocessing
        run: |
          python preprocessing/automate_Reza.py \
            --input loan_default_raw/data_for_training.csv \
            --output preprocessing/loan_default_preprocessed.csv

      - name: Upload preprocessed dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan_default_preprocessed
          path: preprocessing/loan_default_preprocessed.csv

      - name: Commit and push preprocessed data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/loan_default_preprocessed.csv
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: preprocessed dataset [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
